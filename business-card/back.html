<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahaseen Shaik — Card Back</title>
  <style>
    /* ─────────────────────────────────────────
       BACK of card — white bg
       Navy + sage grids, same 48px cell size.
       Sage offset 5px right/down via background-position.
       HOW TO PRINT:
       File → Print → Save as PDF
       Paper: custom 3.5 × 2 in, no margins
       ───────────────────────────────────────── */

    :root {
      --bg:        #ffffff;
      --navy:      #1c1c34;
      --navy-grid: rgba(28, 28, 52, 0.50);
      --sage-grid: rgba(122, 140, 94, 0.42);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e0e0e0;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card-back {
      width: 672px;
      height: 384px;
      background: var(--bg);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 4px 32px rgba(0,0,0,0.15);
    }

    /* Both grids sit as a single pseudo-element layer using
       background-position to offset the sage grid by 5px,
       keeping both grids seamlessly tiled from edge to edge */
    .grid-layer {
      position: absolute;
      inset: 0;
      /* Navy grid: starts at 0,0 */
      background-image:
        repeating-linear-gradient(var(--navy-grid) 0px, var(--navy-grid) 1px, transparent 1px, transparent 48px),
        repeating-linear-gradient(90deg, var(--navy-grid) 0px, var(--navy-grid) 1px, transparent 1px, transparent 48px),
        /* Sage grid: same size, offset 5px via background-position */
        repeating-linear-gradient(var(--sage-grid) 0px, var(--sage-grid) 1px, transparent 1px, transparent 48px),
        repeating-linear-gradient(90deg, var(--sage-grid) 0px, var(--sage-grid) 1px, transparent 1px, transparent 48px);
      background-position:
        0 0,       /* navy horizontal */
        0 0,       /* navy vertical */
        5px 5px,   /* sage horizontal — 5px offset */
        5px 5px;   /* sage vertical   — 5px offset */
      background-size:
        48px 48px,
        48px 48px,
        48px 48px,
        48px 48px;
    }

    /* ── Wordmark ── */
    .back-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
    }

    .back-name {
      font-size: 66px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -1.5px;
      line-height: 1;
      /* White halo so grid lines don't show through letterforms */
      text-shadow:
        0 0 20px #fff,
        0 0 30px #fff;
    }

    .back-divider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }
    .back-divider {
      height: 1px;
      width: 72px;
    }
    .back-divider.navy { background: var(--navy-grid); }
    .back-divider.sage { background: var(--sage-grid); }
    .back-divider-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(122, 140, 94, 0.6);
      flex-shrink: 0;
    }

    /* White backing behind company name so no grid line cuts through */
    .back-company-wrap {
      position: relative;
      padding: 3px 14px;
    }
    .back-company-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #fff;
      border-radius: 3px;
    }
    .back-company {
      position: relative;
      font-size: 11.5px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(28, 28, 52, 0.55);
      text-align: center;
    }

    /* ── Print ── */
    @media print {
      body { background: white; }
      .card-back {
        width: 3.5in;
        height: 2in;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="card-back">

    <div class="grid-layer"></div>

    <div class="back-content">
      <div class="back-name">tahaseen shaik.</div>

      <div class="back-divider-wrap">
        <div class="back-divider navy"></div>
        <div class="back-divider-dot"></div>
        <div class="back-divider sage"></div>
      </div>

      <!-- ✏️ Edit company -->
      <div class="back-company-wrap">
        <div class="back-company">aurora flight sciences</div>
      </div>
    </div>

  </div>
</body>
</html>
