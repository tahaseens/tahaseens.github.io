<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahaseen Shaik — Card Front</title>
  <style>
    :root {
      --bg:          #ffffff;
      --navy:        #1c1c34;
      --sage:        #7a8c5e;
      --sage-light:  #c1caa4;
      --sage-mute:   rgba(122, 140, 94, 0.55);
      --sage-ghost:  rgba(122, 140, 94, 0.10);
      --navy-dim:    rgba(28, 28, 52, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e8e8e8;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* 3.5 × 2 in @ 96dpi × 2 = 672 × 384px */
    .card {
      width: 672px;
      height: 384px;
      background: var(--bg);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      box-shadow: 0 4px 32px rgba(28,28,52,0.13);
    }

    /* ── Left navy strip ── */
    .strip {
      width: 52px;
      flex-shrink: 0;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
    }
    .dot-group { display: flex; flex-direction: column; gap: 7px; align-items: center; }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--sage-light);
    }
    .dot.o5  { opacity: 0.85; }
    .dot.o3  { opacity: 0.50; }
    .dot.o15 { opacity: 0.25; }

    /* ── Main content ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 26px 28px;
      position: relative;
    }

    .content::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 140px; height: 140px;
      background: radial-gradient(ellipse at top right, rgba(193,202,164,0.22) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Name block ── */
    .name-block .name {
      font-size: 40px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .name-block .subtext {
      font-size: 12.5px;
      color: var(--sage);
      letter-spacing: 0.13em;
      margin-top: 6px;
    }

    /* ── Role block ── */
    .role-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .role-label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 4px;
    }
    .role-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.3;
    }
    .company {
      font-size: 13.5px;
      color: var(--navy-dim);
      margin-top: 2px;
    }

    /* ── Contact ── */
    .contact {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .contact-item svg { flex-shrink: 0; opacity: 0.65; }
    .contact-item span {
      font-size: 13px;
      color: var(--navy-dim);
      letter-spacing: 0.01em;
    }

    /* ── Right QR panel ── */
    .qr-panel {
      width: 180px;
      flex-shrink: 0;
      background: var(--sage-ghost);
      border-left: 1px solid rgba(122,140,94,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 18px 12px;
    }

    .qr-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .qr-block img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 3px;
    }

    .qr-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sage);
      font-weight: 600;
      text-align: center;
    }

    .qr-divider {
      width: 60%;
      height: 1px;
      background: rgba(122,140,94,0.25);
      margin: 10px 0;
    }

    /* ── Print ── */
    @media print {
      body { background: white; }
      .card {
        width: 3.5in;
        height: 2in;
        border-radius: 0;
        box-shadow: none;
      }
      .qr-block img { width: 0.6in; height: 0.6in; }
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Left navy strip -->
    <div class="strip">
      <div class="dot-group">
        <div class="dot o5"></div>
        <div class="dot o3"></div>
        <div class="dot o15"></div>
      </div>
      <div class="dot-group">
        <div class="dot o15"></div>
        <div class="dot o3"></div>
        <div class="dot o5"></div>
      </div>
    </div>

    <!-- Main content -->
    <div class="content">

      <!-- ✏️ Name -->
      <div class="name-block">
        <div class="name">tahaseen shaik.</div>
        <div class="subtext">autonomy · robotics · policy</div>
      </div>

      <!-- ✏️ Role -->
      <div class="role-block">
        <div class="role-label">Role</div>
        <div class="role-title">Autonomous Vehicle Software Engineer</div>
        <div class="company">Aurora Flight Sciences</div>
      </div>

      <!-- ✏️ Contact -->
      <div class="contact">
        <div class="contact-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="#1c1c34" stroke-width="1.6"/>
            <polyline points="22,6 12,13 2,6" stroke="#1c1c34" stroke-width="1.6"/>
          </svg>
          <span>shaikt323@gmail.com</span>
        </div>
        <div class="contact-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z" stroke="#1c1c34" stroke-width="1.6"/>
            <rect x="2" y="9" width="4" height="12" stroke="#1c1c34" stroke-width="1.6"/>
            <circle cx="4" cy="4" r="2" stroke="#1c1c34" stroke-width="1.6"/>
          </svg>
          <span>linkedin.com/in/tashaik</span>
        </div>
        <div class="contact-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="#1c1c34" stroke-width="1.6"/>
            <path d="M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18M3 12h18" stroke="#1c1c34" stroke-width="1.4"/>
          </svg>
          <span>tahaseens.github.io</span>
        </div>
      </div>

    </div>

    <!-- ✏️ QR panel — place qr-code_bcard.png in same folder -->
    <div class="qr-panel">
      <div class="qr-block">
        <img src="qr-code_bcard.png" alt="LinkedIn QR code">
        <div class="qr-label">LinkedIn</div>
      </div>
      <div class="qr-divider"></div>
      <div class="qr-block">
        <img src="qr-code_bcard.png" alt="Website QR code">
        <div class="qr-label">Website</div>
      </div>
    </div>

  </div>
</body>
</html>
