<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="./static/style.css">
    <link rel="icon" href="./static/tab-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tahaseen? shaik.</title>
  </head>
  <body scroll="no">
    <div class="tile"></div>

    <!-- Hamburger button -->
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Full-screen overlay menu -->
    <div class="menu-overlay" id="menu-overlay"></div>
    <nav class="menu" id="menu">
      <button class="menu-close" id="menu-close">✕</button>
      <a href="/air-modular-drone">AIR: Modular Drone</a>
      <a href="/gateways-blue-skies-comp">NASA Gateways to Blue Skies</a>
    </nav>

    <div class="name">
      <b>
        <p>tahaseen<br>تحسین<br>తహసీన్</p>
      </b>
      <div class="links-row">
        <a href="https://www.linkedin.com/in/tashaik" target="_blank">
          <img src="./static/linkedin.png" width="50" height="50" alt="linkedin">
        </a>
        <button class="substack-btn" id="substack-btn" aria-label="Subscribe on Substack">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Substack modal -->
    <div class="substack-modal" id="substack-modal">
      <div class="substack-modal-inner">
        <button class="substack-modal-close" id="substack-modal-close">✕</button>
        <iframe src="https://shaiklist.substack.com/embed" width="480" height="320" style="border: 1px solid #EEE; background: white" frameborder="0" scrolling="no"></iframe>
      </div>
    </div>
    <div class="substack-backdrop" id="substack-backdrop"></div>

    <!-- Disclaimer -->
    <footer class="disclaimer">
      Template inspired by <a href="https://azizs1.github.io/" target="_blank">azizs1.github.io</a>
    </footer>

    <script>
      // Hamburger / nav menu
      const hamburger = document.getElementById('hamburger');
      const menu = document.getElementById('menu');
      const overlay = document.getElementById('menu-overlay');
      const menuClose = document.getElementById('menu-close');

      function openMenu() {
        menu.classList.add('open');
        overlay.classList.add('open');
        hamburger.classList.add('hidden');
      }
      function closeMenu() {
        menu.classList.remove('open');
        overlay.classList.remove('open');
        hamburger.classList.remove('hidden');
      }

      hamburger.addEventListener('click', openMenu);
      menuClose.addEventListener('click', closeMenu);
      overlay.addEventListener('click', closeMenu);

      // Substack modal
      const substackBtn = document.getElementById('substack-btn');
      const substackModal = document.getElementById('substack-modal');
      const substackBackdrop = document.getElementById('substack-backdrop');
      const substackClose = document.getElementById('substack-modal-close');

      function openSubstack() {
        substackModal.classList.add('open');
        substackBackdrop.classList.add('open');
      }
      function closeSubstack() {
        substackModal.classList.remove('open');
        substackBackdrop.classList.remove('open');
      }

      substackBtn.addEventListener('click', openSubstack);
      substackClose.addEventListener('click', closeSubstack);
      substackBackdrop.addEventListener('click', closeSubstack);
    </script>
  </body>
</html>
